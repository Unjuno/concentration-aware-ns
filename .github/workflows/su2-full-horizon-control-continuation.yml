name: SU2 full-horizon CFL control continuation

on:
  workflow_dispatch:
  push:
    branches:
      - physicsnemo-global-hessian-audit
    paths:
      - .github/workflows/su2-full-horizon-control-continuation.yml
      - protocols/su2-n32-full-horizon-cfl-control-continuation-v3.json

permissions:
  contents: read

jobs:
  control:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-su2-cfl-control]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked analysis dependencies
        run: python -m pip install -r requirements-verification-locked.txt

      - name: Prepare the frozen matched inputs
        run: >-
          python -m tools.prepare_su2_full_horizon_cfl_pair
          --output work/su2-cfl-control-continuation-v3/inputs
          --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json

      - name: Reverify the archived completed baseline before spending solver time
        run: |
          python -m tools.verify_su2_cfl_continuation_preconditions \
            --protocol protocols/su2-n32-full-horizon-cfl-control-continuation-v3.json \
            --baseline-root evidence/su2-full-horizon-run-37160281461/results \
            --output work/su2-cfl-control-continuation-v3/baseline-replay.json

      - name: Build the pinned ARM64 successor image
        run: |
          mkdir -p work/su2-cfl-control-continuation-v3/image
          docker build --platform linux/arm64 \
            --iidfile work/su2-cfl-control-continuation-v3/image/image-id \
            -t cans-su2-control-continuation runtime/su2 \
            > work/su2-cfl-control-continuation-v3/image/build.log 2>&1
          python -m tools.collect_su2_successor_image \
            --image-id "$(cat work/su2-cfl-control-continuation-v3/image/image-id)" \
            --output work/su2-cfl-control-continuation-v3/image/image-audit

      - name: Require exact identity with the completed baseline image
        run: |
          python -m tools.verify_su2_successor_image_match \
            --expected evidence/su2-full-horizon-run-37160281461/results/successor-receipt.json \
            --actual work/su2-cfl-control-continuation-v3/image/image-audit/receipt.json \
            --output work/su2-cfl-control-continuation-v3/image/image-match.json

      - name: Run only the frozen CFL=100 control
        run: |
          python -m tools.run_su2_full_horizon_cfl_pair \
            --root work/su2-cfl-control-continuation-v3/inputs \
            --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json \
            --output work/su2-cfl-control-continuation-v3/results \
            --successor-receipt work/su2-cfl-control-continuation-v3/image/image-audit/receipt.json \
            --case control

      - name: Preserve complete or partial continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su2-full-horizon-control-continuation-${{ github.sha }}
          path: work/su2-cfl-control-continuation-v3/
          if-no-files-found: warn
          retention-days: 90
