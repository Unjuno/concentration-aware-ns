name: SU2 full-horizon CFL matched rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - physicsnemo-global-hessian-audit
    paths:
      - .github/workflows/su2-full-horizon-cfl-matched-rebuild.yml
      - protocols/su2-n32-full-horizon-cfl-matched-rebuild-v4.json

permissions:
  contents: read

jobs:
  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-su2-cfl-matched-pair]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked analysis dependencies
        run: python -m pip install -r requirements-verification-locked.txt

      - name: Prepare frozen inputs and verify the historical baseline
        run: |
          mkdir -p work/su2-cfl-matched-rebuild-v4
          python -m tools.prepare_su2_full_horizon_cfl_pair \
            --output work/su2-cfl-matched-rebuild-v4/inputs \
            --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json
          python -m tools.verify_su2_cfl_continuation_preconditions \
            --protocol protocols/su2-n32-full-horizon-cfl-control-continuation-v3.json \
            --baseline-root evidence/su2-full-horizon-run-37160281461/results \
            --output work/su2-cfl-matched-rebuild-v4/historical-baseline-replay.json

      - name: Build and measure the one image shared by both fresh cases
        run: |
          mkdir -p work/su2-cfl-matched-rebuild-v4/image
          docker build --platform linux/arm64 \
            --iidfile work/su2-cfl-matched-rebuild-v4/image/image-id \
            -t cans-su2-matched-rebuild runtime/su2 \
            > work/su2-cfl-matched-rebuild-v4/image/build.log 2>&1
          python -m tools.collect_su2_successor_image \
            --image-id "$(cat work/su2-cfl-matched-rebuild-v4/image/image-id)" \
            --output work/su2-cfl-matched-rebuild-v4/image/baseline-image-audit

      - name: Run only the frozen CFL=10 baseline
        run: |
          mkdir -p work/su2-cfl-matched-rebuild-v4/baseline
          python -m tools.run_su2_full_horizon_cfl_pair \
            --root work/su2-cfl-matched-rebuild-v4/inputs \
            --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json \
            --output work/su2-cfl-matched-rebuild-v4/baseline/results \
            --successor-receipt work/su2-cfl-matched-rebuild-v4/image/baseline-image-audit/receipt.json \
            --case baseline
          docker save --output work/su2-cfl-matched-rebuild-v4/image/image.tar \
            "$(cat work/su2-cfl-matched-rebuild-v4/image/image-id)"

      - name: Preserve complete or partial baseline and image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su2-cfl-matched-baseline-${{ github.sha }}
          path: work/su2-cfl-matched-rebuild-v4/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  control:
    needs: baseline
    if: >-
      needs.baseline.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-su2-cfl-matched-pair]'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked analysis dependencies
        run: python -m pip install -r requirements-verification-locked.txt

      - name: Download the completed baseline and its exact image archive
        uses: actions/download-artifact@v4
        with:
          name: su2-cfl-matched-baseline-${{ github.sha }}
          path: work/su2-cfl-matched-rebuild-v4

      - name: Load and remeasure the exact baseline image
        run: |
          docker load --input work/su2-cfl-matched-rebuild-v4/image/image.tar
          expected_id="$(cat work/su2-cfl-matched-rebuild-v4/image/image-id)"
          loaded_id="$(docker image inspect "$expected_id" --format '{{.Id}}')"
          test "$loaded_id" = "$expected_id"
          python -m tools.collect_su2_successor_image \
            --image-id "$loaded_id" \
            --output work/su2-cfl-matched-rebuild-v4/image/control-image-audit
          python -m tools.verify_su2_successor_image_match \
            --expected work/su2-cfl-matched-rebuild-v4/image/baseline-image-audit/receipt.json \
            --actual work/su2-cfl-matched-rebuild-v4/image/control-image-audit/receipt.json \
            --output work/su2-cfl-matched-rebuild-v4/image/image-match.json

      - name: Run only the frozen CFL=100 control and review both cases
        run: |
          mkdir -p work/su2-cfl-matched-rebuild-v4/control
          python -m tools.run_su2_full_horizon_cfl_pair \
            --root work/su2-cfl-matched-rebuild-v4/inputs \
            --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json \
            --output work/su2-cfl-matched-rebuild-v4/control/results \
            --successor-receipt work/su2-cfl-matched-rebuild-v4/image/baseline-image-audit/receipt.json \
            --case control
          python -m tools.review_su2_full_horizon_cfl_pair \
            --baseline-root work/su2-cfl-matched-rebuild-v4/baseline/results \
            --control-root work/su2-cfl-matched-rebuild-v4/control/results \
            --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json \
            --output work/su2-cfl-matched-rebuild-v4/pair-review.json

      - name: Preserve complete or partial paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su2-cfl-matched-pair-${{ github.sha }}
          path: |
            work/su2-cfl-matched-rebuild-v4/historical-baseline-replay.json
            work/su2-cfl-matched-rebuild-v4/inputs/
            work/su2-cfl-matched-rebuild-v4/image/image-id
            work/su2-cfl-matched-rebuild-v4/image/build.log
            work/su2-cfl-matched-rebuild-v4/image/baseline-image-audit/
            work/su2-cfl-matched-rebuild-v4/image/control-image-audit/
            work/su2-cfl-matched-rebuild-v4/image/image-match.json
            work/su2-cfl-matched-rebuild-v4/baseline/results/
            work/su2-cfl-matched-rebuild-v4/control/
            work/su2-cfl-matched-rebuild-v4/pair-review.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
