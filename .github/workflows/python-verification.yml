name: Python verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-verification-locked.txt
            requirements-verification.txt
            requirements.txt
      - name: Install verification dependencies
        run: python -m pip install -r requirements-verification-locked.txt
      - name: Run Python test suite
        run: python -m pytest -q tests

      - name: Compile the SU2 shared-MMS adapter and compare its forcing
        run: CXX=g++ python -m tools.check_su2_high_gradient_force

      - name: Recompute exact periodic forced-NS candidate
        run: |
          mkdir -p work
          python tools/check_forced_periodic_ns_candidate.py > work/forced-periodic-ns-candidate.json

      - name: Recheck published native samples and analytic enclosures
        run: |
          mkdir -p work
          python -c "import sys,json,platform,flint,numpy; print(json.dumps({'python':sys.version,'platform':platform.platform(),'machine':platform.machine(),'python_flint':flint.__version__,'flint':flint.__FLINT_VERSION__,'numpy':numpy.__version__},indent=2))" > work/published-cell-point-matrix-environment.json
          python -m tools.verify_published_cell_point_matrix --output work/published-cell-point-matrix-verification --source-commit "$GITHUB_SHA" > work/published-cell-point-matrix-verification.log 2>&1
          python -m tools.check_cell_point_dyadic_receipts --output work/published-cell-point-dyadic-scalar.json
      - name: Recompute conditional particle drag audit
        run: |
          python -m tools.audit_solid_particle_drag_branches --output work/solid-particle-drag-branch-audit --source-commit "$GITHUB_SHA"
          python -m tools.audit_particle_body_force_sensitivity --output work/particle-body-force-audit --source-commit "$GITHUB_SHA"
          g++ --version > work/solid-particle-drag-compiler.txt
          for opt in 0 2; do
            g++ -std=c++17 -O"$opt" evidence/solid-particle-drag-branches-v2/standalone-control.cpp -o "work/solid-particle-drag-O$opt"
            "work/solid-particle-drag-O$opt" > "work/solid-particle-drag-O$opt.json"
          done
          python -m tools.check_solid_particle_drag_transcriptions --input work/solid-particle-drag-O0.json --input work/solid-particle-drag-O2.json --output work/solid-particle-drag-transcription-check.json
      - name: Recompute continuous SU2 manufactured-force bounds
        run: |
          python -m tools.bound_su2_force_time_displacement --output work/su2-force-coarse-bound --source-commit "$GITHUB_SHA"
          python -m tools.tighten_su2_force_envelope_bound --output work/su2-force-envelope-bound --source-commit "$GITHUB_SHA"
      - name: Preserve published-matrix verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-cell-point-matrix-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            work/published-cell-point-matrix-verification/
            work/published-cell-point-matrix-verification.log
            work/published-cell-point-matrix-environment.json
            work/published-cell-point-dyadic-scalar.json
            work/forced-periodic-ns-candidate.json
            work/solid-particle-drag-branch-audit/
            work/particle-body-force-audit/
            work/su2-force-coarse-bound/
            work/su2-force-envelope-bound/
            work/solid-particle-drag-compiler.txt
            work/solid-particle-drag-O*.json
            work/solid-particle-drag-transcription-check.json
          if-no-files-found: warn
          retention-days: 90

  su2-cfl-successor:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/su2-cfl-successor-')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-verification-locked.txt
      - name: Prepare exact paired inputs
        run: |
          mkdir -p work/su2-hosted-successor
          uname -m > work/su2-hosted-successor/architecture.txt
          python -m tools.prepare_su2_full_horizon_cfl_pair --output work/su2-hosted-successor/inputs --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json > work/su2-hosted-successor/preparation.json
      - name: Build frozen successor and preserve image identity
        run: |
          docker build --platform linux/arm64 --iidfile work/su2-hosted-successor/image-id -t cans-su2-hosted-successor runtime/su2 > work/su2-hosted-successor/build.log 2>&1
          python -m tools.collect_su2_successor_image --image-id "$(cat work/su2-hosted-successor/image-id)" --output work/su2-hosted-successor/image-audit
      - name: Run fresh matched full-horizon pair
        run: python -m tools.run_su2_full_horizon_cfl_pair --root work/su2-hosted-successor/inputs --protocol protocols/su2-n32-full-horizon-cfl-control-v1.json --output work/su2-hosted-successor/results --successor-receipt work/su2-hosted-successor/image-audit/receipt.json
      - name: Preserve native successor evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su2-full-horizon-successor-${{ github.sha }}
          path: work/su2-hosted-successor/
          if-no-files-found: warn
          retention-days: 90
