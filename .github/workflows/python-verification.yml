name: Python verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install verification dependencies
        run: python -m pip install -r requirements-verification.txt pytest
      - name: Run Python test suite
        run: python -m pytest -q tests
