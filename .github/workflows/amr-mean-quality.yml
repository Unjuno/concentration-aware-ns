name: Foundation 13 AMR mean quality

on:
  pull_request:
    paths:
      - '.github/workflows/amr-mean-quality.yml'
      - 'protocols/of13-amr-mean-quality-v1.json'
      - 'tools/*amr_mean_quality*'
      - 'tools/audit_amr_mean_reference_precheck.py'
      - 'tools/analyze_amr_gauss_gradient.py'
      - 'tools/compare_amr_resolution_volume_integrated.py'
      - 'evidence/upstream-refresh/of13-amr-stock-payload-hashes-v1.json'
      - 'requirements-verification*.txt'
      - 'requirements.txt'
      - 'tools/run_high_gradient_openfoam.py'
      - 'tools/openfoam_amr_case.py'
      - 'tools/openfoam_case.py'
      - 'tools/high_gradient_reference.py'
      - 'tools/amr_derivative_projection.py'
      - 'tools/amr_projection_decomposition.py'
      - 'tools/high_gradient_cell_average.py'
      - 'tools/high_gradient_acceptance.py'
      - 'runtime/openfoam13/instrumentation/prepare_amr_stage_module.py'
      - 'runtime/of13-interface-operator/Dockerfile'
      - 'runtime/of13-interface-operator/fetch_pinned_package.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amr-mean-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.changed.outputs.execute }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          execute=true
          valid_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ && "$1" != 0000000000000000000000000000000000000000 ]]; }
          if [[ "$EVENT_NAME" == pull_request && "$EVENT_ACTION" == synchronize ]] &&
             valid_sha "$BEFORE_SHA" && valid_sha "$HEAD_SHA" &&
             [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              paths="$RUNNER_TEMP/amr-mean-quality-changed-paths"
              if git diff --name-only --no-renames -z "$BEFORE_SHA" "$HEAD_SHA" -- > "$paths"; then
                execute=false
                while IFS= read -r -d '' path; do
                  case "$path" in
                    .github/workflows/amr-mean-quality.yml|protocols/of13-amr-mean-quality-v1.json|\
                    tools/*amr_mean_quality*|tools/audit_amr_mean_reference_precheck.py|\
                    tools/analyze_amr_gauss_gradient.py|tools/compare_amr_resolution_volume_integrated.py|\
                    evidence/upstream-refresh/of13-amr-stock-payload-hashes-v1.json|requirements-verification*.txt|\
                    requirements.txt|tools/run_high_gradient_openfoam.py|\
                    tools/openfoam_amr_case.py|tools/openfoam_case.py|\
                    tools/high_gradient_reference.py|tools/amr_derivative_projection.py|\
                    tools/amr_projection_decomposition.py|tools/high_gradient_cell_average.py|\
                    tools/high_gradient_acceptance.py|runtime/openfoam13/instrumentation/prepare_amr_stage_module.py|\
                    runtime/of13-interface-operator/Dockerfile|runtime/of13-interface-operator/fetch_pinned_package.sh)
                      execute=true; break ;;
                  esac
                done < "$paths"
              fi
            fi
          fi
          printf 'execute=%s\n' "$execute" >> "$GITHUB_OUTPUT"
  experiment:
    needs: changes
    if: needs.changes.outputs.execute == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        case: [n16-dt0.001, n32-dt0.001, n64-dt0.001, n32-dt0.0005]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen analysis dependencies
        run: python -m pip install -r requirements-verification-locked.txt
      - name: Fetch pinned sparse Foundation module
        shell: bash
        run: |
          git init work/pinned-of13
          git -C work/pinned-of13 remote add origin https://github.com/OpenFOAM/OpenFOAM-13.git
          git -C work/pinned-of13 sparse-checkout init --cone
          git -C work/pinned-of13 sparse-checkout set applications/modules/incompressibleFluid
          git -C work/pinned-of13 fetch --filter=blob:none --depth=1 origin 18870c24d21c6b982e2cdec27b2f59738cca5f90
          git -C work/pinned-of13 checkout --detach FETCH_HEAD
      - name: Build the pinned package runtime
        shell: bash
        run: |
          mkdir -p evidence/amr-mean-runtime-build
          df -B1 . > evidence/amr-mean-runtime-build/free-disk-before.txt
          set -o pipefail
          docker build --platform linux/arm64 -t concentration-aware-ns:of13-amr-mean-v1 runtime/of13-interface-operator 2>&1 | tee evidence/amr-mean-runtime-build/build.log
          docker image inspect concentration-aware-ns:of13-amr-mean-v1 > evidence/amr-mean-runtime-build/image-inspect.json
      - name: Run frozen case and capture-control when required
        run: |
          python -m tools.run_amr_mean_quality --case-id '${{ matrix.case }}' \
            --image concentration-aware-ns:of13-amr-mean-v1 --source work/pinned-of13 \
            --work-root 'work/amr-mean-${{ matrix.case }}' \
            --evidence-root 'evidence/amr-mean-hosted-${{ matrix.case }}'
      - name: Verify archive and analyze separate gates
        run: |
          python -m tools.analyze_amr_mean_quality --evidence-root 'evidence/amr-mean-hosted-${{ matrix.case }}'
          python -m pip freeze > 'evidence/amr-mean-hosted-${{ matrix.case }}/analysis-packages.txt'
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amr-mean-quality-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/amr-mean-runtime-build/
            evidence/amr-mean-hosted-${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 90
