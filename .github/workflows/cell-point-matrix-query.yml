name: Foundation 13 matrix native position replay
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: cell-point-matrix-query-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        case: [n32, n64, n32half]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-verification-locked.txt
      - name: Download frozen capture and source
        shell: bash
        run: |
          mkdir -p work
          python - <<'PYCODE'
          import json,subprocess,hashlib,pathlib
          spec=json.loads(pathlib.Path('protocols/of13-cell-point-matrix-query-${{ matrix.case }}-v1.json').read_text())
          subprocess.run(['curl','--fail','--location','--retry','3','-o','work/capture.tar.gz',spec['release_url']],check=True)
          h=hashlib.file_digest(open('work/capture.tar.gz','rb'),'sha256').hexdigest()
          if h!=spec['release_sha256']:raise ValueError('capture digest mismatch')
          PYCODE
          git init work/pinned-of13
          git -C work/pinned-of13 remote add origin https://github.com/OpenFOAM/OpenFOAM-13.git
          git -C work/pinned-of13 fetch --filter=blob:none --depth=1 origin 18870c24d21c6b982e2cdec27b2f59738cca5f90
      - name: Build pinned ARM64 runtime
        shell: bash
        run: |
          mkdir -p evidence/cell-point-query-build
          set -o pipefail
          docker build --platform linux/arm64 -t concentration-aware-ns:of13-cell-point-matrix-query-v1 runtime/of13-interface-operator 2>&1 | tee evidence/cell-point-query-build/build.log
          docker image inspect concentration-aware-ns:of13-cell-point-matrix-query-v1 > evidence/cell-point-query-build/image.json
      - name: Execute read-only native position replay
        run: |
          python -m tools.run_of13_cell_point_matrix_query --bundle work/capture.tar.gz --image concentration-aware-ns:of13-cell-point-matrix-query-v1 --source work/pinned-of13 --work work/query-replay-v1 --evidence evidence/of13-cell-point-matrix-query-v1 --protocol protocols/of13-cell-point-matrix-query-${{ matrix.case }}-v1.json
          python -m tools.analyze_of13_cell_point_matrix_query --evidence evidence/of13-cell-point-matrix-query-v1 --protocol protocols/of13-cell-point-matrix-query-${{ matrix.case }}-v1.json
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: of13-cell-point-matrix-query-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/cell-point-query-build/
            evidence/of13-cell-point-matrix-query-v1/
            work/query-replay-v1/probe/cansCellPointQueryProbe
          if-no-files-found: error
          retention-days: 90
